policy_version = "2d.2"
effective_date = 2026-07-30
report_root = "data/quality"
validated_manifest_root = "data/validated/manifests"
default_controlled_duration_seconds = 120
max_controlled_duration_seconds = 300
max_messages_per_venue = 20000

[quality.integrity]
require_archive_validation = true
require_all_checksums = true
allow_partial_shards = false
allow_writer_errors = false
allow_missing_manifest = false
allow_missing_quality_summary = false

[quality.parsing]
max_parse_error_rate = 0.001
max_unsupported_message_rate = 0.01
max_wrong_symbol_messages = 0

[quality.timestamps]
max_nonmonotonic_receipt_events = 0
max_missing_exchange_timestamp_rate = 0.05
stale_quote_threshold_ms = 2000

[quality.coverage]
minimum_session_duration_seconds = 120
minimum_frames_per_venue = 100
minimum_trades_per_venue = 1
minimum_top_of_book_events_per_venue = 10
minimum_cross_venue_overlap_seconds = 90
maximum_start_skew_seconds = 15

[quality.duplicates]
max_exact_raw_duplicate_rate = 0.01
max_duplicate_trade_id_rate = 0.001

[quality.decisions]
quarantine_on_sequence_anomaly = true
quarantine_on_timestamp_outlier = true
quarantine_on_duplicate_warning = true
quarantine_on_stale_quote_warning = true

[quality.exchange_receipt_delta]
stable_offset_severity = "info"
low_variance_offset_severity = "info"
mixed_distribution_severity = "warning"
sporadic_outlier_severity = "warning"
unstable_offset_severity = "warning"
insufficient_evidence_severity = "info"
minimum_events_for_classification = 30
stable_negative_rate = 0.8
stable_max_iqr_ms = 1000
low_variance_max_iqr_ms = 250
sporadic_negative_rate = 0.05
unstable_min_iqr_ms = 3000

[quality.coinbase_continuity]
product_sequence_jump_severity = "info"
duplicate_related_sequence_severity = "info"
nonmonotonic_sequence_severity = "warning"
heartbeat_missing_match_severity = "warning"
conflicting_trade_id_severity = "error"
match_ticker_correspondence_minimum = 0.95
match_ticker_grace_ms = 5000

[quality.kraken_duplicates]
heartbeat_duplicate_severity = "info"
status_duplicate_severity = "info"
subscription_ack_duplicate_severity = "info"
ticker_duplicate_severity = "info"
ticker_semantic_duplicate_severity = "info"
trade_raw_duplicate_severity = "warning"
identical_trade_duplicate_severity = "warning"
conflicting_trade_duplicate_severity = "error"
unsupported_duplicate_severity = "info"
other_duplicate_severity = "warning"

[quality.quote_freshness]
quote_age_severity = "info"
heartbeat_healthy_quiet_severity = "info"
market_activity_without_bbo_change_severity = "info"
probable_feed_inactivity_severity = "warning"
connection_inactivity_severity = "warning"
coinbase_unmatched_trade_severity = "warning"
coinbase_conflicting_trade_severity = "error"
connection_inactivity_threshold_ms = 10000
coinbase_match_ticker_grace_ms = 5000
