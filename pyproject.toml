[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cross-venue-price-discovery"
version = "1.0.0"
description = "Reproducible BTC/USD cross-venue price-discovery research on Coinbase and Kraken."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ansh Hemang Dani" }]
keywords = [
    "bitcoin",
    "cryptocurrency",
    "econometrics",
    "market-microstructure",
    "price-discovery",
    "quantitative-finance",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
  "duckdb>=1.0",
  "httpx>=0.27",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "polars>=1.0",
  "pyarrow>=16.0",
  "pydantic>=2.8",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "statsmodels>=0.14",
  "websockets>=12.0",
]

[project.urls]
Homepage = "https://github.com/AnshDani2004/cross-venue-price-discovery"
Repository = "https://github.com/AnshDani2004/cross-venue-price-discovery"
Issues = "https://github.com/AnshDani2004/cross-venue-price-discovery/issues"

[project.optional-dependencies]
dev = [
  "hypothesis>=6.100",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cross_venue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config -m 'not live and not live_persistence and not live_quality'"
markers = [
  "integration: tests that require network, exchange sandboxes, or local services",
  "live: opt-in public exchange smoke tests",
  "live_persistence: opt-in public exchange persistence smoke tests",
  "live_quality: opt-in paired public exchange quality validation tests",
  "live_calibration: opt-in bounded paired public exchange calibration pilots",
  "local_validated_data: opt-in tests that require ignored accepted local manifests",
  "campaign_smoke: opt-in nonresearch campaign collection smoke tests",
  "local_campaign_data: opt-in tests that require ignored local campaign artifacts",
  "property: property-based tests",
  "regression: locked behavior tests for previously fixed issues",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "PTH", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src/cross_venue"]
